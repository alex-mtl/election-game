<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Streamer Overlay</title>
<link rel="stylesheet" href="/common/base.css">
<style>
  /* Transparent overlay for the streamer's video. ?bg=green -> chroma key, ?bg=dark -> preview */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent;
               font-family: 'Segoe UI', system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  body.bg-green { background: #00ff00; }
  body.bg-dark  { background: #14121c; }

  :root { --bw: 20vw; }                     /* balloon width = 20% of the screen */
  #ground { position: fixed; left: 0; right: 0; bottom: 5vh; height: 40vh; pointer-events: none; }
  #sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

  .balloon { position: relative; width: var(--bw); flex: none; transform-origin: 50% 100%; }
  .balloon .body { position: relative; width: 100%; filter: drop-shadow(0 0 1.2vw rgba(255, 60, 140, .55)); }
  .balloon svg { display: block; width: 100%; height: auto; overflow: visible; }
  .balloon .av { position: absolute; left: 27%; top: 20%; width: 46%; aspect-ratio: 1; border-radius: 50%;
                 object-fit: cover; border: .45vw solid #fff; box-shadow: 0 0 1vw rgba(0,0,0,.35);
                 display: flex; align-items: center; justify-content: center; color: #fff;
                 font: 900 calc(var(--bw) * .2) 'Segoe UI', sans-serif; }
  .balloon .tag { position: absolute; left: 50%; top: 63%; transform: translateX(-50%); max-width: 92%;
                  padding: .15em .6em; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff;
                  font: 800 calc(var(--bw) * .085) 'Segoe UI', sans-serif; white-space: nowrap;
                  overflow: hidden; text-overflow: ellipsis; }

  /* inflating at the bottom: grows with likes, wobbles a little */
  /* each viewer's balloon gets its own random spot on the ground (--x is its centre, in vw) */
  .balloon.inflating { position: absolute; bottom: 0; left: calc(var(--x, 50) * 1vw); margin-left: calc(var(--bw) / -2);
                       transition: transform .35s cubic-bezier(.3, 1.6, .5, 1), opacity .6s;
                       animation: wobble 2.6s ease-in-out infinite; }
  .balloon.inflating .meter { position: absolute; left: 50%; bottom: -1.6vw; transform: translateX(-50%);
                       font: 900 calc(var(--bw) * .1) 'Segoe UI', sans-serif; color: #fff;
                       text-shadow: 0 0 .6vw #ff2d75, 0 0 .2vw #000; white-space: nowrap; }
  .balloon.leaving { opacity: 0; }
  @keyframes wobble { 0%, 100% { rotate: -2deg; } 50% { rotate: 2deg; } }

  /* lift off: rise to the top, swaying left/right around its own vertical axis and growing
     from 20vw (its size on the ground) to 30vw wide (--grow = 30 / 20) as it climbs */
  .flyer { position: absolute; bottom: 0;
           animation: rise var(--dur) cubic-bezier(.45, .05, .6, 1) forwards, grow var(--dur) ease-out forwards; }
  .flyer .sway { animation: sway var(--period) ease-in-out infinite alternate; }
  .flyer .meter { display: none; }
  @keyframes rise { 0% { transform: translateY(0) scale(1); }
                    8% { transform: translateY(-3vh) scale(1.08); }
                    100% { transform: translateY(-130vh) scale(1); } }
  /* 20vw on the ground -> 30vw wide, reached while it is still on screen (the top of the screen is reached at ~45% of the flight) */
  @keyframes grow { from { scale: 1; } 42%, to { scale: var(--grow, 1.5); } }
  @keyframes sway { from { transform: translateX(calc(var(--amp) * -1)) rotate(calc(var(--tilt) * -1)); }
                    to { transform: translateX(var(--amp)) rotate(var(--tilt)); } }

  .burst { position: absolute; font: 900 4vw 'Segoe UI', sans-serif; color: #fff; pointer-events: none;
           text-shadow: 0 0 1vw #ff2d75, 0 0 .3vw #000; animation: burst 1.6s ease-out forwards; white-space: nowrap; }
  @keyframes burst { from { opacity: 0; transform: translate(-50%, 0) scale(.6); }
                     20% { opacity: 1; transform: translate(-50%, -2vh) scale(1.1); }
                     to { opacity: 0; transform: translate(-50%, -10vh) scale(1); } }

  /* menu button only on hover, so nothing shows on stream */
  #menu { position: fixed; right: 1vw; top: 1vw; z-index: 50; opacity: 0; transition: opacity .2s; }
  #menu:hover, body.bg-dark #menu { opacity: .6; }
</style>
</head>
<body>
<div id="sky"></div>
<div id="ground"></div>
<button id="menu" class="ctl-btn" title="Menu">☰</button>

<!-- heart balloon template -->
<template id="tpl">
  <div class="balloon"><div class="sway"><div class="body">
    <svg viewBox="0 0 100 150">
      <defs>
        <radialGradient id="g" cx="35%" cy="30%" r="75%">
          <stop offset="0" stop-color="#ff9cc4"/><stop offset=".45" stop-color="#ff2d75"/><stop offset="1" stop-color="#b3003c"/>
        </radialGradient>
      </defs>
      <path d="M50 92 C 22 72, 2 52, 6 30 C 10 10, 36 4, 50 22 C 64 4, 90 10, 94 30 C 98 52, 78 72, 50 92 Z" fill="url(#g)"/>
      <ellipse cx="27" cy="27" rx="9" ry="5" fill="#fff" opacity=".45" transform="rotate(-35 27 27)"/>
      <path d="M45 97 L50 91 L55 97 Z" fill="#b3003c"/>
      <path d="M50 97 C 44 108, 56 118, 49 128 C 44 136, 54 142, 50 150" stroke="#fff" stroke-opacity=".75"
            stroke-width="1.1" fill="none"/>
    </svg>
    <div class="tag"></div>
  </div></div><div class="meter"></div></div>
</template>

<script src="/common/i18n.js"></script>
<script src="/common/live.js"></script>
<script src="/common/audio.js"></script>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  if (qs.get('bg')) document.body.classList.add('bg-' + qs.get('bg'));
  document.getElementById('menu').onclick = () => { location.href = '/'; };
  const sound = qs.get('sound') === '1';
  if (sound) AudioKit.mount({ hello: 'b.v.hello' });

  const ground = document.getElementById('ground'), sky = document.getElementById('sky');
  const tpl = document.getElementById('tpl');
  const onGround = new Map();               // viewer id -> balloon element
  const clean = n => (n || '').replace(/[^\p{L}\p{N} ._'-]/gu, '').trim() || '?';
  let per = 100;

  function avatar(name, url) {
    const hue = [...(name || '?')].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
    if (url && /^https:\/\//.test(url)) {
      const img = document.createElement('img');
      img.className = 'av'; img.referrerPolicy = 'no-referrer'; img.alt = ''; img.src = url;
      img.onerror = () => img.replaceWith(avatar(name, ''));
      return img;
    }
    const d = document.createElement('div');
    d.className = 'av'; d.textContent = (clean(name)[0] || '?').toUpperCase();
    d.style.background = `hsl(${hue} 85% 55%)`;
    return d;
  }
  function makeBalloon(u) {
    const b = tpl.content.firstElementChild.cloneNode(true);
    b.querySelector('.body').insertBefore(avatar(u.name, u.avatar), b.querySelector('.tag'));
    b.querySelector('.tag').textContent = u.name;
    return b;
  }

  // A free spot for a new balloon: random, but never closer than 10% of the screen width to either
  // edge (its whole 20vw box stays inside 10vw..90vw, so its centre is 20..80). Among a few random
  // candidates take the one farthest from the balloons already on the ground, so they don't pile up.
  function pickX() {
    const taken = [...onGround.values()].map(el => parseFloat(el.dataset.x));
    let best = 50, bestGap = -1;
    for (let i = 0; i < 12; i++) {
      const x = 20 + Math.random() * 60;
      const gap = taken.length ? Math.min(...taken.map(t => Math.abs(t - x))) : 100;
      if (gap > bestGap) { best = x; bestGap = gap; }
    }
    return best.toFixed(1);
  }

  // ---- inflating balloons at the bottom (from state) ----
  function render(s) {
    per = s.perBalloon || per;
    const seen = new Set();
    s.inflating.forEach(u => {
      seen.add(u.id);
      let b = onGround.get(u.id);
      if (!b) {
        b = makeBalloon(u);
        b.classList.add('inflating');
        b.dataset.x = pickX();
        b.style.setProperty('--x', b.dataset.x);
        b.style.transform = 'scale(.45)';
        ground.appendChild(b);
        onGround.set(u.id, b);
      }
      b.style.transform = 'scale(' + (0.45 + 0.55 * Math.min(1, u.fill)).toFixed(3) + ')';
      b.querySelector('.meter').textContent = '❤ ' + u.progress + '/' + per;
    });
    onGround.forEach((b, id) => {          // owner stopped liking -> fade away
      if (!seen.has(id)) {
        onGround.delete(id);
        b.classList.add('leaving');
        setTimeout(() => b.remove(), 700);
      }
    });
  }

  // ---- lift off ----
  function launch(e) {
    let b = onGround.get(e.id), x;
    const W = window.innerWidth;
    if (b) {                                 // take the inflating balloon off the ground
      const r = b.getBoundingClientRect();
      x = r.left + r.width / 2;
      onGround.delete(e.id);
      b.remove();
      b.classList.remove('inflating');
      b.style.transform = '';
    } else {
      b = makeBalloon(e);
      x = W / 2;
    }
    x = Math.min(Math.max(x, W * 0.2), W * 0.8);   // 30vw wide at the top + sway must stay on screen
    const rnd = (a, z) => a + Math.random() * (z - a);
    const fly = document.createElement('div');
    fly.className = 'flyer';
    fly.style.left = (x - b.offsetWidth / 2 || x - W * 0.1) + 'px';
    fly.style.setProperty('--dur', rnd(6.5, 8.5).toFixed(2) + 's');
    fly.style.setProperty('--period', rnd(1.3, 2.1).toFixed(2) + 's');
    fly.style.setProperty('--amp', rnd(2.5, 6).toFixed(2) + 'vw');
    fly.style.setProperty('--tilt', rnd(3, 8).toFixed(1) + 'deg');
    fly.appendChild(b);
    sky.appendChild(fly);
    fly.style.left = (x - b.getBoundingClientRect().width / 2) + 'px';
    const burst = document.createElement('div');
    burst.className = 'burst'; burst.textContent = '❤ ' + per + '  ' + clean(e.name);
    burst.style.left = x + 'px'; burst.style.bottom = '22vh';
    sky.appendChild(burst);
    setTimeout(() => burst.remove(), 1700);
    setTimeout(() => fly.remove(), 9000);
    if (sound && AudioKit.ready) {
      AudioKit.tone(400, 0, 0.6, 'sine', 0.12, 1200);
      [880, 1175, 1568].forEach((f, i) => AudioKit.tone(f, 0.15 + i * 0.08, 0.3, 'sine', 0.1));
      AudioKit.say(I18N.t('s.v.balloon', { name: clean(e.name), n: per }));
    }
  }

  Live.start({ game: 'streamer', onState: render, onEvent: e => { if (e.type === 'balloon') launch(e); } });
})();
</script>
</body>
</html>
