<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Live Games</title>
<link rel="stylesheet" href="/common/neon.css">
<style>
  html, body { overflow-y: auto; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: safe center; min-height: 100%;
         gap: calc(var(--u) * 4); padding: calc(var(--u) * 5); }
  h1 { font: 900 calc(var(--u) * 9)/1 var(--font-display); letter-spacing: .06em; text-align: center; }
  .sub { font: 700 calc(var(--u) * 4.2) var(--font-text); color: var(--muted); letter-spacing: .2em;
         margin-top: calc(var(--u) * 2); text-align: center; }
  .games { display: flex; flex-direction: column; gap: calc(var(--u) * 3.5); width: calc(var(--u) * 86); }
  .card { position: relative; display: block; width: 100%; text-align: left; cursor: pointer;
          padding: calc(var(--u) * 4) calc(var(--u) * 5); border-radius: calc(var(--u) * 4);
          background: var(--bg-panel); color: var(--text); font-family: var(--font-text);
          border: 2px solid var(--c); transition: transform .15s, box-shadow .15s;
          box-shadow: 0 0 calc(var(--u) * 3) var(--c), inset 0 0 calc(var(--u) * 5) color-mix(in srgb, var(--c) 25%, transparent); }
  .card:hover, .card:focus-visible { transform: scale(1.03); outline: none;
          box-shadow: 0 0 calc(var(--u) * 6) var(--c), inset 0 0 calc(var(--u) * 8) color-mix(in srgb, var(--c) 35%, transparent); }
  .card .t { font: 900 calc(var(--u) * 6)/1.05 var(--font-display); color: var(--c);
             text-shadow: 0 0 .2em var(--c), 0 0 .7em var(--c); }
  .card .d { font-size: calc(var(--u) * 3.8); margin-top: calc(var(--u) * 1.8); color: #e6dcff; }
  .card .chat { display: inline-block; margin-top: calc(var(--u) * 2.2); font: 800 calc(var(--u) * 3.6) var(--font-display);
                padding: .35em .8em; border-radius: 999px; border: 1px solid var(--c); color: var(--c); }
  .card .now { position: absolute; top: 0; right: calc(var(--u) * 5); transform: translateY(-50%);
               font: 800 calc(var(--u) * 3) var(--font-display); color: #000; background: var(--c);
               padding: .3em .7em; border-radius: 999px; display: none; }
  .card.active .now { display: block; }
  .battle { --c: var(--pink); }
  .guess  { --c: var(--cyan); }
  .streamer { --c: var(--lime); }
  .foot { color: var(--muted); font-size: calc(var(--u) * 3.4); text-align: center; }
  .langs { display: flex; align-items: center; gap: calc(var(--u) * 2); font: 800 calc(var(--u) * 3.2) var(--font-display);
           color: var(--muted); letter-spacing: .15em; }
  .langs button { font: 900 calc(var(--u) * 3.6) var(--font-display); padding: .45em .9em; border-radius: 999px; cursor: pointer;
                  background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .alerts { font: 900 calc(var(--u) * 3.6) var(--font-display); padding: .55em 1.1em; border-radius: 999px; cursor: pointer;
            background: transparent; color: var(--gold); border: 2px solid var(--gold); box-shadow: 0 0 1em rgba(255,216,74,.35); }
  .alerts.on { color: #000; background: var(--gold); }
  .alerts.armed { animation: blink 1.2s infinite; }
  .alerts.missed { color: #fff; border-color: var(--pink); background: var(--pink); box-shadow: 0 0 1.4em var(--pink); }
  @keyframes blink { 50% { opacity: .45; } }
  #feed { width: calc(var(--u) * 86); padding: calc(var(--u) * 3); }
  #feed[hidden] { display: none; }
  #feed .ft { font: 900 calc(var(--u) * 3.2) var(--font-display); color: var(--cyan); letter-spacing: .15em; margin-bottom: .4em; }
  .fl { font-size: calc(var(--u) * 3.6); font-weight: 700; padding: .2em 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fl.gift { color: var(--gold); }
  .langs button.on { color: #000; background: var(--lime); border-color: var(--lime); box-shadow: 0 0 1em var(--lime); }
</style>
</head>
<body>
  <div>
    <h1><span class="neon-magenta">LIVE</span> <span class="neon-cyan">GAMES</span></h1>
    <div class="sub" data-i18n="menu.sub">CHOOSE WHAT WE PLAY</div>
  </div>
  <div class="langs"><span data-i18n="menu.lang">LANGUAGE</span>
    <button data-lang="en">EN</button><button data-lang="ru">RU</button></div>
  <div class="games" id="games"></div>
  <button class="alerts" id="alerts" data-i18n="alert.off">🔕 STREAM ALERTS: OFF</button>
  <div id="feed" class="panel" hidden><div class="ft" data-i18n="alert.feed">LIVE CHAT</div><div id="feedList"></div></div>
  <div class="foot" data-i18n="menu.foot">The game screen follows your choice on every device</div>
<script src="/common/i18n.js"></script>
<script src="/common/live.js"></script>
<script src="/common/audio.js"></script>
<script>
const t = I18N.t;
let state = null;
function render() {
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.lang === state.lang));
  const box = document.getElementById('games');
  box.replaceChildren();
  state.games.forEach(g => {
    const b = document.createElement('button');
    b.className = 'card ' + g.name + (g.name === state.active ? ' active' : '');
    const now = document.createElement('div'); now.className = 'now'; now.textContent = t('menu.now');
    const ti = document.createElement('div'); ti.className = 't'; ti.textContent = t('game.' + g.name);
    const d = document.createElement('div'); d.className = 'd'; d.textContent = t('menu.' + g.name + '.d');
    const c = document.createElement('div'); c.className = 'chat'; c.textContent = t('menu.' + g.name + '.chat');
    b.append(now, ti, d, c);
    b.onclick = async () => {
      await fetch('/api/active', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                   body: JSON.stringify({ game: g.name }) });
      location.href = '/' + g.name + '/' + location.search;
    };
    box.appendChild(b);
  });
}
document.querySelectorAll('.langs button').forEach(b => b.onclick = async () => {
  await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                 body: JSON.stringify({ lang: b.dataset.lang }) });
  load();
});
async function load() {
  state = await (await fetch('/api/games', { cache: 'no-store' })).json();
  I18N.set(state.lang);
  I18N.apply();
  render();
}
load();

// ---------- stream alerts (only on the menu page) ----------
// comment -> phone ring + the comment read aloud; gift -> church bell + the gifter's name
const A = AudioKit;
let alertsOn = false, lastRing = 0;
const queue = [];
const clean = n => (n || '').replace(/[^\p{L}\p{N} ._'-]/gu, '').trim() || '?';

function ring() {                                  // classic phone trill, two bursts
  for (let burst = 0; burst < 2; burst++) {
    for (let i = 0; i < 18; i++) {
      A.tone(i % 2 ? 1300 : 1600, burst * 0.75 + i * 0.025, 0.03, 'sine', 0.13);
    }
  }
}
function bell() {                                  // "ding-dong" with bell partials
  [[660, 0], [520, 0.55]].forEach(([f, d]) => {
    A.tone(f, d, 2.2, 'sine', 0.22);
    A.tone(f * 2.01, d, 1.4, 'sine', 0.08);
    A.tone(f * 2.76, d, 0.9, 'sine', 0.05);
    A.tone(f * 0.5, d, 2.6, 'sine', 0.06);
  });
}
function addFeedLine(e) {
  const box = document.getElementById('feedList');
  const li = document.createElement('div');
  li.className = 'fl ' + e.type;
  li.textContent = e.type === 'gift'
    ? '🎁 ' + clean(e.name) + ' — ' + clean(e.gift) + (e.count > 1 ? ' ×' + e.count : '')
    : '💬 ' + clean(e.name) + ': ' + (e.text || '');
  box.prepend(li);
  while (box.children.length > 6) box.lastChild.remove();
  document.getElementById('feed').hidden = false;
}
let speakingSince = 0;
function next() {                                  // one alert at a time, never piling up
  if (A.speaking) {                                // Chrome/Edge bug: speech can get stuck "speaking"
    speakingSince = speakingSince || Date.now();
    if (Date.now() - speakingSince > 20000) { A.resetSpeech(); speakingSince = 0; }
    return;
  }
  speakingSince = 0;
  if (!alertsOn || !A.ready || !queue.length) return;
  const e = queue.shift();
  const now = Date.now();
  if (e.type === 'gift') {
    bell();
    setTimeout(() => A.say(t('alert.gift', { name: clean(e.name), gift: clean(e.gift) })), 900);
  } else {
    let delay = 0;
    if (now - lastRing > 10000) { ring(); lastRing = now; delay = 1500; }
    setTimeout(() => A.say(t('alert.chat', { name: clean(e.name), text: e.text })), delay);
  }
}
setInterval(next, 400);
function onFeed(e) {
  addFeedLine(e);
  if (e.type === 'chat' && e.host) return;        // your own comments don't ring
  if (armed) document.getElementById('alerts').classList.add('missed');   // sound still locked: flash
  queue.push(e);
  while (queue.length > 3) queue.shift();         // busy chat: keep only the latest
  next();
}
// "armed": alerts were on before a reload, but the browser needs one click to allow sound again
let armed = false;
function setAlerts(on) {
  alertsOn = on;
  armed = false;
  const b = document.getElementById('alerts');
  b.dataset.i18n = on ? 'alert.on' : 'alert.off';
  b.textContent = t(b.dataset.i18n);
  b.classList.toggle('on', on);
  b.classList.remove('armed', 'missed');
  try { localStorage.setItem('alerts', on ? '1' : '0'); } catch (e) {}
}
document.getElementById('alerts').onclick = ev => {
  ev.stopPropagation();
  A.enable();
  setAlerts(armed ? true : !alertsOn);
  if (alertsOn) A.say(t('alert.hello'));
};
let saved = false;
try { saved = localStorage.getItem('alerts') === '1'; } catch (e) {}
setAlerts(false);
if (saved) {                                       // restore after a reload
  A.enable();                                      // works without a click if the site may autoplay
  setTimeout(() => { if (armed && A.running) setAlerts(true); }, 400);
  armed = true;
  const b = document.getElementById('alerts');
  b.dataset.i18n = 'alert.armed';
  b.textContent = t('alert.armed');
  b.classList.add('armed');
  try { localStorage.setItem('alerts', '1'); } catch (e) {}
  document.addEventListener('click', ev => {
    if (!armed || (ev.target && ev.target.id === 'alerts')) return;   // the button handles itself
    A.enable();
    setAlerts(true);
    queue.length = 0;
  }, { capture: true, once: true });
}
Live.start({ game: null, onFeed });
</script>
</body>
</html>
