services:
  game:
    # Ready-made image (built by GitHub Actions on every push to main): `docker compose up -d`
    # just downloads it. Developers rebuild locally with `docker compose up -d --build`.
    image: ghcr.io/alex-mtl/election-game:latest
    build: .
    pull_policy: missing
    container_name: election-game
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8765
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "${HOST_PORT:-8765}:8765"
