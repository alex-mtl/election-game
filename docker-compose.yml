services:
  game:
    build: .
    image: election-game
    container_name: election-game
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8765
      STATE_FILE: /data/state.json
    volumes:
      - ./data:/data
    ports:
      - "${HOST_PORT:-8765}:8765"
