<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tug of War: Red vs Yellow</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; font-family:Arial,Helvetica,sans-serif;
              background:#111; color:#fff; -webkit-user-select:none; user-select:none; }
  /* background: colors move with the score; text stays fixed in screen halves */
  #bar { position:fixed; inset:0; display:flex; }
  #redSide  { background:linear-gradient(180deg,#e03131,#a61e1e); transition:width .3s; }
  #yelSide  { background:linear-gradient(180deg,#ffd43b,#e8a90c); transition:width .3s; }
  #cols { position:fixed; inset:0; display:flex; pointer-events:none; }
  .col { position:relative; width:50%; display:flex; flex-direction:column; align-items:center;
         justify-content:center; padding-top:16vh; }
  #colYel { color:#3a2b00; }
  .label { position:absolute; top:8vh; left:0; right:0; text-align:center; font-size:7vw;
           font-weight:900; letter-spacing:1px; white-space:nowrap; }
  #colRed .label { color:#ffd43b; text-shadow:0 2px 8px rgba(0,0,0,.45); }
  #colYel .label { color:#e03131; text-shadow:0 0 3px #fff, 0 1px 6px rgba(255,255,255,.5); }
  .pct { font-size:16vw; font-weight:900; text-shadow:0 2px 12px rgba(0,0,0,.35); }
  .taps { font-size:6vw; font-weight:700; opacity:.9; margin-top:1vh; }
  .team { font-size:5vw; font-weight:900; letter-spacing:2px; margin-bottom:1vh; }
  #round { position:fixed; top:2vh; left:0; right:0; text-align:center; font-size:4.6vw;
           font-weight:700; pointer-events:none; text-shadow:0 1px 6px rgba(0,0,0,.6); }
  #vs { position:fixed; top:8vh; left:50%; transform:translateX(-50%); font-size:7vw;
        font-weight:900; pointer-events:none; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  #hint { position:fixed; bottom:0; left:0; right:0; text-align:center; padding:2vh;
          font-size:4.5vw; font-weight:700; background:rgba(0,0,0,.55); pointer-events:none; }
  #leaders { position:fixed; top:16vh; left:0; right:0; display:flex;
             justify-content:space-between; gap:4vw; padding:0 4vw; font-size:4.2vw;
             pointer-events:none; }
  .top3 { background:rgba(0,0,0,.45); border-radius:2vw; padding:1.5vw 3vw;
          min-width:38vw; max-width:46vw; color:#fff; }
  .top3:empty { visibility:hidden; }
  .top3 .row { display:flex; justify-content:space-between; gap:2vw; font-weight:700;
               white-space:nowrap; }
  .top3 .row span:first-child { overflow:hidden; text-overflow:ellipsis; }
  #topYel { text-align:right; }
  #win { position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
         justify-content:center; z-index:10; text-align:center; padding:5vw; }
  #win.show { display:flex; }
  #win.red { background:rgba(160,20,20,.94); } #win.yellow { background:rgba(200,150,10,.94); }
  #win h1 { font-size:11vw; margin-bottom:3vh; }
  #win p  { font-size:6vw; }
</style>
</head>
<body>
<div id="bar">
  <div id="redSide" style="width:50%"></div>
  <div id="yelSide" style="width:50%"></div>
</div>
<div id="cols">
  <div id="colRed" class="col">
    <div class="label">Red</div>
    <div class="team">Type R</div><div class="pct" id="redPct">50%</div>
    <div class="taps">👆 <span id="redTaps">0</span></div>
  </div>
  <div id="colYel" class="col">
    <div class="label">Yellow</div>
    <div class="team">Type Y</div><div class="pct" id="yelPct">50%</div>
    <div class="taps">👆 <span id="yelTaps">0</span></div>
  </div>
</div>
<div id="round">Round 1</div>
<div id="vs">VS</div>
<div id="leaders"><div class="top3" id="topRed"></div><div class="top3" id="topYel"></div></div>
<div id="hint">Type <b>R</b> in chat for Red, <b>Y</b> for Yellow. Tap as many times as you want!</div>
<div id="win"><h1 id="winTitle"></h1><p id="winMvp"></p></div>

<script>
function renderTop(id, list){
  const el = document.getElementById(id);
  el.replaceChildren();
  if (!list.length) return;
  list.forEach((t, i) => {
    const row = document.createElement('div'); row.className = 'row';
    const n = document.createElement('span'); n.textContent = (i + 1) + '. ' + t[0];
    const v = document.createElement('span'); v.textContent = t[1];
    row.append(n, v); el.appendChild(row);
  });
}
async function tick(){
  try {
    const s = await (await fetch('state.json',{cache:'no-store'})).json();
    document.getElementById('redSide').style.width = s.red_pct + '%';
    document.getElementById('yelSide').style.width = s.yellow_pct + '%';
    document.getElementById('redPct').textContent = s.red_pct + '%';
    document.getElementById('yelPct').textContent = s.yellow_pct + '%';
    document.getElementById('redTaps').textContent = s.taps_red;
    document.getElementById('yelTaps').textContent = s.taps_yellow;
    document.getElementById('round').textContent = 'Round ' + s.round;
    renderTop('topRed', s.top_red);
    renderTop('topYel', s.top_yellow);
    const w = document.getElementById('win');
    if (s.winner) {
      w.className = 'show ' + (s.winner === 'red' ? 'red' : 'yellow');
      document.getElementById('winTitle').textContent =
        s.winner === 'red' ? '🏆 RED WINS!' : '🏆 YELLOW WINS!';
      document.getElementById('winMvp').textContent =
        s.mvp ? ('MVP: ' + s.mvp + ' — ' + s.mvp_taps + ' taps') : '';
    } else { w.className = ''; }
  } catch(e) { /* server unreachable */ }
}
setInterval(tick, 500); tick();
</script>
</body>
</html>
